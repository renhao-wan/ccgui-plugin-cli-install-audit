name: check

# 每次 push / PR 都跑一遍：产物与源码一致、manifest 校验、反馈区冒烟。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 共用库是 npm 依赖（ccgui-plugin-shared），必须装了才能 build。
      - name: Install dependencies
        run: npm ci

      - name: Build main.js from sources
        run: node scripts/build.mjs

      # 改了 src 忘了 build，或手改了 main.js：这里会失败。
      - name: Ensure committed bundle is up to date
        run: git diff --exit-code main.js

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs

      # 反馈区冒烟只用 Node，不依赖 PowerShell，可以在 Linux 上跑。
      - name: Run feedback smoke tests
        run: node scripts/smoke.mjs
